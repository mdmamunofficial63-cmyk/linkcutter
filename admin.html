<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a12"><title>Key Manager</title>
<style>
:root{--bg:#0a0a12;--fg:#f3f4f9;--mut:#8d92a6;--card:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.05);--g1:#6366f1;--g2:#a855f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 40px;max-width:620px;margin:0 auto;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-25% -15% auto -15%;height:60%;background:radial-gradient(circle at 25% 30%,rgba(99,102,241,.35),transparent 58%),radial-gradient(circle at 80% 15%,rgba(168,85,247,.28),transparent 55%);pointer-events:none;z-index:-1}
h1{font-size:23px;letter-spacing:-.03em;margin:4px 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 18px 40px -22px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font-size:16px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.22)}
button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px -8px rgba(99,102,241,.55);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
.w{width:100%}
.s{background:var(--in);border:1px solid var(--bd);box-shadow:none;padding:8px 12px;font-size:13px}
.r{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--bd)}.r:first-child{border:0}
.n{flex:1;min-width:0}.n small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.t{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:700}.free{background:rgba(16,185,129,.2);color:#34d399}.used{background:rgba(245,158,11,.2);color:#fbbf24}.blocked{background:rgba(239,68,68,.2);color:#f87171}
#m{color:#f87171;font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
#new{display:none;border-color:var(--g1)}#new b{display:block;font:700 17px ui-monospace,Menlo,monospace;word-break:break-all;margin:6px 0}
</style></head><body>
<h1>Key Manager</h1><div class="sub">Create, reset and block access keys.</div>
<div class="c"><div class="l">Authentication</div><input id="sec" type="password" placeholder="Admin secret" autocomplete="off"><button class="w" id="ld">Load keys</button><div id="m"></div></div>
<div class="c"><div class="l">New key</div><input id="lb" placeholder="Label (optional)"><button class="w" id="cr">Create key</button></div>
<div class="c" id="new"><div class="l">New key created</div></div>
<div class="c"><div class="l">Keys</div><div id="ls" style="color:var(--mut);font-size:14px">Load keys to see their status.</div></div>
<script>
var $=function(i){return document.getElementById(i)};
var SN={free:'Available',used:'In use',blocked:'Blocked'};
async function api(o){o.action='admin';o.admin=$('sec').value;
  try{var r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});return await r.json()}catch(e){return {ok:false,msg:'Connection problem.'}}}
function ago(t){return t?new Date(t).toLocaleString():''}
function draw(j){
  $('m').textContent=j.ok?'':(/thik nai/i.test(j.msg||'')?'Incorrect admin secret.':(j.msg||'Something went wrong.'));if(!j.ok)return;
  if(j.made){var n=$('new');n.style.display='block';n.innerHTML='<div class="l">New key created</div><b>'+j.made.key+'</b><span style="color:var(--mut);font-size:13px">'+j.made.id+' \u00b7 Copy it now. It will not be shown again.</span>'}
  $('ls').innerHTML=j.list.map(function(x){return '<div class="r"><div class="n"><b>'+x.id+'</b> '+(x.label||'')+'<small>'+ago(x.at)+'</small></div><span class="t '+x.state+'">'+SN[x.state]+'</span><button class="s" data-o="reset" data-i="'+x.id+'">Reset</button><button class="s" data-o="block" data-i="'+x.id+'">Block</button></div>'}).join('')}
$('ld').onclick=async function(){draw(await api({op:'list'}))};
$('cr').onclick=async function(){draw(await api({op:'create',label:$('lb').value}));$('lb').value=''};
$('ls').onclick=async function(e){var b=e.target.closest('button');if(!b)return;
  if(!confirm((b.dataset.o==='reset'?'Reset ':'Block ')+b.dataset.i+'?'))return;draw(await api({op:b.dataset.o,id:b.dataset.i}))};
</script></body></html>
