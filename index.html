<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Link Cutter">
<meta name="theme-color" content="#0a0a12">
<meta name="robots" content="noindex">
<title>Link Cutter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#f4f5fa;--fg:#101119;--mut:#6a6f82;--card:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7));--bd:rgba(20,20,40,.1);--in:#fff;--g1:#6366f1;--g2:#a855f7;--ok:#10b981;--bad:#ef4444;--sh:0 18px 40px -22px rgba(30,30,70,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a12;--fg:#f3f4f9;--mut:#8d92a6;--card:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.045);--sh:0 18px 40px -22px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{--bg:#0a0a12;--fg:#f3f4f9;--mut:#8d92a6;--card:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.045);--sh:0 18px 40px -22px rgba(0,0,0,.8)}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;min-height:100%;padding:22px 16px 0;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-25% -15% auto -15%;height:65%;background:radial-gradient(circle at 25% 30%,rgba(99,102,241,.38),transparent 58%),radial-gradient(circle at 80% 15%,rgba(168,85,247,.3),transparent 55%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto}
.ic{width:18px;height:18px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head{display:flex;align-items:center;gap:13px;margin:4px 0 22px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 28px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.logo .ic{width:22px;height:22px}
h1{font-size:23px;margin:0;letter-spacing:-.03em;font-weight:700}
.sub{font-size:13px;color:var(--mut);margin-top:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:11px}
textarea{width:100%;min-height:130px;resize:vertical;padding:13px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--fg);font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;transition:border-color .15s,box-shadow .15s}
textarea::placeholder,input::placeholder{color:var(--mut);opacity:.75}
textarea:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.22)}
.chip{font-size:12px;font-weight:700;min-width:26px;text-align:center;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;letter-spacing:0}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;letter-spacing:0;text-transform:none}
.mini .ic{width:14px;height:14px;vertical-align:0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .2s,opacity .2s,box-shadow .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55}
.sp{height:14px}
#hint{font-size:12.5px;font-weight:600;color:var(--g1);margin-top:9px}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:11px;background:var(--in);border:1px solid var(--bd);border-radius:14px}
.seg button{flex:1;padding:8px 4px;font-size:12px;font-weight:600;border:0;border-radius:10px;background:transparent;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
#list{max-height:176px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.item{padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--in);margin-bottom:6px;transition:opacity .2s;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.item .t{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.item .t b{color:var(--g1);font-weight:600}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:14px 8px}
#stat{font-size:12px;color:var(--mut);margin-top:9px;text-align:right}
.cmp{padding:11px 12px}
.rng{display:flex;align-items:center;gap:8px}
.rng span{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.rng input{flex:1;min-width:0;padding:9px 6px;text-align:center;font-size:15px;font-weight:700;border:1px solid var(--bd);border-radius:12px;background:var(--in);color:var(--fg);outline:none}
.rng input:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.22)}
.rbtn{flex:none;padding:10px 15px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
.bar{position:sticky;bottom:0;display:flex;gap:10px;margin-top:16px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 38%)}
.bar button{flex:1;padding:15px;border-radius:15px;font-size:15px;font-weight:700;border:1px solid var(--bd)}
.pri{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0!important;box-shadow:0 12px 26px -6px rgba(99,102,241,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.pri.ok{background:var(--ok);box-shadow:0 12px 26px -6px rgba(16,185,129,.5)}
.sec{background:var(--in);color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ok);color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;transition:.25s;z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
#toast.bad{background:var(--bad)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#gate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
#gate:before{content:"";position:absolute;inset:-25% -15% auto -15%;height:65%;background:radial-gradient(circle at 25% 30%,rgba(99,102,241,.38),transparent 58%),radial-gradient(circle at 80% 15%,rgba(168,85,247,.3),transparent 55%);pointer-events:none}
.gbox{position:relative;width:100%;max-width:380px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:30px 22px 24px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.gbox .logo{margin:0 auto 16px;width:54px;height:54px;border-radius:17px}
.gbox h2{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
.gbox p{margin:0 0 20px;color:var(--mut);font-size:14px}
#key{width:100%;padding:15px;font-size:16px;text-align:center;border:1px solid var(--bd);border-radius:15px;background:var(--in);color:var(--fg);outline:none;letter-spacing:.06em;font-weight:600}
#key:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.22)}
#gerr{min-height:22px;color:var(--bad);font-size:13px;font-weight:600;margin:11px 0 3px}
.gbtn{width:100%;padding:15px;border-radius:15px;font-size:15px;font-weight:700;margin-top:10px;border:1px solid var(--bd)}
.gnote{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.6}
.shake .gbox{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="gate"><div class="gbox">
  <div class="logo"><svg class="ic" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg></div>
  <h2>Access Key</h2><p>Enter your private key to continue.</p>
  <input id="key" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LC-XXXX-XXXX-XXXX">
  <div id="gerr"></div>
  <button class="pri gbtn" id="gl">Unlock &amp; remember this device</button>
  <button class="sec gbtn" id="go">Unlock for this session</button>
  <div class="gnote">Remembered keys keep you signed in on this device.<br>Session keys sign out when the tab is closed.</div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="head">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg></div>
    <div><h1>Link Cutter</h1><div class="sub">Clean verification links in one tap</div></div>
    <button class="mini" id="lock" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Lock</button>
  </div>

  <div class="card">
    <div class="lbl"><span>Input</span><button class="mini" id="paste"><svg class="ic" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Paste</button></div>
    <textarea id="in" placeholder="Paste your links here. A serial number or email before each link is kept." spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="hint"></div>
  </div>

  <div class="sp"></div>

  <div class="card">
    <div class="lbl"><span>Result</span><span class="chip" id="cnt">0</span></div>
    <div class="seg" id="seg"><button data-m="0">Serial · Email · Link</button><button data-m="1">Serial · Link</button><button data-m="2">Link only</button></div>
    <div id="list"><div class="empty">Results will appear here</div></div>
    <div id="stat"></div>
  </div>

  <div class="sp"></div>

  <div class="card cmp">
    <div class="rng"><span>FROM</span><input id="from" type="number" inputmode="numeric" min="1" placeholder="1"><span>TO</span><input id="to" type="number" inputmode="numeric" min="1" placeholder="All"><button class="pri rbtn" id="rcopy">Copy</button></div>
  </div>

  <div class="bar"><button class="pri" id="copy">Copy All</button><button class="sec" id="clear">Clear</button></div>
</div>
<div id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)};
function cutOne(chunk){
  var t=chunk.replace(/\s+/g,'');
  var m=t.match(/https?:\/\//i);
  if(!m) return '';
  t=t.slice(m.index);
  var i=t.search(/[&?]ses/i);
  if(i<0){var a=t.indexOf('&');if(a>0)i=a;}
  if(i>0)t=t.slice(0,i);
  var id=t.match(/^(https?:\/\/[^?]*\?inquiry-id=inq_[A-Za-z0-9]{30})/);
  if(id)t=id[1];
  return t.replace(/-+$/,'');
}
function done(l){var t=l.replace(/\s+/g,'');return /[&?]ses/i.test(t)||/inquiry-id=inq_[A-Za-z0-9]{30}/.test(t);}
function cut(raw){
  var lines=raw.split(/\r?\n/),o=[],cur=null,pend='',seen={},dup=0;
  function fin(){if(cur){var r=cutOne(cur.link);if(r){var k=cur.ser+'|'+cur.pre+'|'+r;if(seen[k])dup++;else{seen[k]=1;o.push({ser:cur.ser,pre:cur.pre,link:r})}}cur=null}}
  lines.forEach(function(ln){
    ln=ln.trim();if(!ln)return;
    var m=ln.match(/https?:\/\//i);
    if(m){fin();var px=ln.slice(0,m.index).trim(),sn=pend,sm=px.match(/^(\d+)[.)]\s*/);if(sm){if(!sn)sn=sm[1]+'.';px=px.slice(sm[0].length)}var em=px.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);cur={ser:sn,pre:em?em[0]+'----':px,link:ln.slice(m.index)};pend='';}
    else if(cur&&!done(cur.link)&&!/^\d+[.)]?$/.test(ln)&&ln.indexOf('@')<0){cur.link+=ln;}
    else{fin();pend=ln;}
  });
  fin();o.forEach(function(x,i){if(!x.ser)x.ser=(i+1)+'.'});o.dup=dup;return o;
}
var inp=$('in'),list=$('list'),cnt=$('cnt'),toast=$('toast'),items=[],mode=0,tt;
try{mode=+localStorage.getItem('lc_mode')||0}catch(e){}
function headOf(it){return (mode<2&&it.ser?it.ser+' ':'')+(mode===0&&it.pre?it.pre+(/[-\s]$/.test(it.pre)?'':' '):'')}
function fmt(it){return headOf(it)+it.link}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(m,bad){clearTimeout(tt);toast.textContent=m;toast.className=(bad?'bad ':'')+'on';tt=setTimeout(function(){toast.className=''},2000)}
function rng(){var n=items.length,f=parseInt($('from').value)||1,t=parseInt($('to').value)||n;if(f<1)f=1;if(t>n)t=n;return [f,t]}
function upd(){
  var r=rng(),f=r[0],t=r[1];
  $('rcopy').textContent=!items.length?'Copy':(t<f?'Range?':'Copy '+f+'\u2013'+t);
  [].forEach.call(list.querySelectorAll('.item'),function(el,i){el.style.opacity=(i+1>=f&&i+1<=t)?1:.35});
}
function flash(b){if(!b)return;var o=b.textContent;b.classList.add('ok');b.textContent='Copied \u2713';setTimeout(function(){b.classList.remove('ok');b.textContent=o;upd()},1200)}
function copyText(t,btn){
  if(!t){show('Nothing to copy',1);return}
  function ok(){show('Copied to clipboard');flash(btn)}
  function fb(){
    var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(a);a.select();a.setSelectionRange(0,a.value.length);
    var s=false;try{s=document.execCommand('copy')}catch(e){}
    a.remove();if(s)ok();else show('Copy failed. Please try again.',1);
  }
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
function run(){
  items=cut(inp.value);
  cnt.textContent=items.length;
  var s=[];
  if(items.length)s.push(inp.value.length.toLocaleString()+' \u2192 '+items.map(fmt).join('\n').length.toLocaleString()+' characters');
  if(items.dup)s.push(items.dup+' duplicate'+(items.dup>1?'s':'')+' removed');
  $('stat').textContent=s.join(' \u00b7 ');
  if(!items.length){list.innerHTML='<div class="empty">'+(inp.value.trim()?'No valid links found':'Results will appear here')+'</div>';upd();return}
  list.innerHTML=items.map(function(it){return '<div class="item"><div class="t"><b>'+esc(headOf(it))+'</b>'+esc(it.link)+'</div></div>'}).join('');
  upd();
}
function segUpd(){[].forEach.call($('seg').children,function(b){b.classList.toggle('on',+b.dataset.m===mode)})}
inp.addEventListener('input',run);
$('from').addEventListener('input',upd);
$('to').addEventListener('input',upd);
segUpd();
$('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;try{localStorage.setItem('lc_mode',mode)}catch(x){}segUpd();run()});
$('copy').onclick=function(){copyText(items.map(fmt).join('\n'),this)};
$('rcopy').onclick=function(){
  var r=rng();if(r[1]<r[0]){show('Invalid range',1);return}
  copyText(items.slice(r[0]-1,r[1]).map(fmt).join('\n'),this);
};
$('clear').onclick=function(){inp.value='';$('from').value='';$('to').value='';$('hint').textContent='';run();inp.blur()};
$('paste').onclick=function(){
  function manual(){inp.focus();$('hint').textContent='Automatic paste is blocked here. Tap and hold the box, then choose Paste.';setTimeout(function(){$('hint').textContent=''},8000)}
  try{navigator.clipboard.readText().then(function(t){if(t){inp.value=t;run();inp.blur()}else manual()},manual)}catch(e){manual()}
};
inp.addEventListener('paste',function(){setTimeout(function(){run();inp.blur()},60)});
['from','to'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')e.target.blur()})});
document.addEventListener('click',function(e){
  var a=document.activeElement;
  if(a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)&&!e.target.closest('textarea,input,#paste'))a.blur();
});

/* access control */
function M(m){m=m||'';
  if(/onno device/i.test(m))return 'This key is already linked to another device.';
  if(/bondho/i.test(m))return 'This key has been disabled.';
  if(/thik nai/i.test(m))return 'Invalid key. Please check and try again.';
  if(/likhun/i.test(m))return 'Please enter your key.';
  return m||'Something went wrong. Please try again.'}
function dev(){var d=null;try{d=localStorage.getItem('lc_dev');if(!d){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Date.now()+Math.random().toString(36).slice(2));localStorage.setItem('lc_dev',d)}}catch(e){}return d||('t'+Math.random().toString(36).slice(2,12))}
async function check(k){
  try{var r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:k,device:dev()})});
    var j=await r.json();return j&&typeof j.ok==='boolean'?j:{ok:false,net:1,msg:'Connection problem. Please try again.'}}
  catch(e){return {ok:false,net:1,msg:'Connection problem. Please try again.'}}
}
function openApp(){$('gate').style.display='none';$('app').style.display='block'}
function clr(){try{localStorage.removeItem('lc_auth');sessionStorage.removeItem('lc_auth')}catch(e){}}
function lockApp(){clr();$('app').style.display='none';$('gate').style.display='flex';$('key').value='';$('gerr').textContent=''}
var fails=0,until=0;
function gerr(m){$('gerr').style.color='';$('gerr').textContent=m;var g=$('gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
function busy(b){$('gl').disabled=b;$('go').disabled=b;if(b){$('gerr').style.color='var(--mut)';$('gerr').textContent='Verifying\u2026'}else{$('gerr').style.color='';$('gerr').textContent=''}}
async function tryKey(life){
  var now=Date.now();if(now<until){gerr('Too many attempts. Try again in '+Math.ceil((until-now)/1000)+'s.');return}
  var k=$('key').value.trim().toUpperCase();if(!k){gerr('Please enter your key.');return}
  busy(true);var j=await check(k);busy(false);
  if(!j.ok){if(!j.net){fails++;if(fails>=5){until=Date.now()+30000;fails=0}}gerr(M(j.msg));return}
  try{(life?localStorage:sessionStorage).setItem('lc_auth',k)}catch(e){}
  fails=0;$('key').value='';$('key').blur();openApp();
}
$('gl').onclick=function(){tryKey(true)};
$('go').onclick=function(){tryKey(false)};
$('lock').onclick=lockApp;
$('key').addEventListener('keydown',function(e){if(e.key==='Enter')e.target.blur()});
(async function(){
  var k=null;try{k=localStorage.getItem('lc_auth')||sessionStorage.getItem('lc_auth')}catch(e){}
  $('gate').style.display='flex';
  if(!k)return;
  busy(true);var j=await check(k);busy(false);
  if(j.ok)openApp();else{if(!j.net)clr();gerr(M(j.msg))}
})();
</script>
</body>
</html>
