<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Link Cutter">
<meta name="theme-color" content="#0a0a12">
<meta name="robots" content="noindex">
<title>Link Cutter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#f3f4fb;--fg:#0f1118;--mut:#6b7085;--card:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.78));--bd:rgba(20,22,50,.08);--in:rgba(15,17,40,.035);--g1:#6366f1;--g2:#a855f7;--ok:#10b981;--bad:#ef4444;--sh:0 1px 0 rgba(255,255,255,.6) inset,0 20px 40px -26px rgba(30,30,80,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080f;--fg:#f4f5fb;--mut:#8a8fa8;--card:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));--bd:rgba(255,255,255,.085);--in:rgba(255,255,255,.045);--sh:0 1px 0 rgba(255,255,255,.07) inset,0 24px 48px -26px rgba(0,0,0,.9)}}
:root[data-theme="dark"]{--bg:#08080f;--fg:#f4f5fb;--mut:#8a8fa8;--card:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));--bd:rgba(255,255,255,.085);--in:rgba(255,255,255,.045);--sh:0 1px 0 rgba(255,255,255,.07) inset,0 24px 48px -26px rgba(0,0,0,.9)}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;min-height:100%;padding:20px 16px 48px;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-25% -15% auto -15%;height:65%;background:radial-gradient(circle at 22% 28%,rgba(99,102,241,.32),transparent 58%),radial-gradient(circle at 82% 12%,rgba(168,85,247,.26),transparent 55%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 22px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:46px;height:46px;flex:none;border-radius:15px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;box-shadow:0 12px 26px -8px rgba(99,102,241,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.logo .ic{width:22px;height:22px}
h1{font-size:23px;margin:0;letter-spacing:-.03em;font-weight:750}
.brand p{margin:3px 0 0;font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.lbl-r{display:flex;gap:6px}
.chip{min-width:28px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .2s,opacity .2s,box-shadow .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--in);color:var(--fg);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none}
.ghost.sm{padding:6px 11px}
.ghost .ic{width:14px;height:14px}
.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:15px;padding:14px;font-size:15px;font-weight:700;box-shadow:0 14px 28px -10px rgba(99,102,241,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.pri.wide{width:100%;margin-top:14px}
.pri.ok{background:var(--ok);box-shadow:0 14px 28px -10px rgba(16,185,129,.55)}
.rbtn{flex:none;padding:11px 16px;border-radius:13px;font-size:14px;font-weight:700;white-space:nowrap}
textarea{width:100%;min-height:128px;resize:vertical;padding:14px;border:1px solid var(--bd);border-radius:16px;background:var(--in);color:var(--fg);font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;transition:border-color .15s,box-shadow .15s}
textarea::placeholder,input::placeholder{color:var(--mut);opacity:.7}
textarea:focus,input:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.2)}
#hint{font-size:12.5px;font-weight:600;color:var(--g1);margin-top:10px}
.seg{display:flex;gap:4px;padding:4px;margin-bottom:14px;background:var(--in);border:1px solid var(--bd);border-radius:15px}
.seg button{flex:1;padding:9px 4px;font-size:12px;font-weight:600;border:0;border-radius:11px;background:transparent;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 18px -6px rgba(99,102,241,.6)}
.pfx{margin-bottom:14px}
.pl{display:flex;align-items:center;gap:12px}
.pl span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.pl input{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--bd);border-radius:13px;background:var(--in);color:var(--fg);font-size:15px;font-weight:700;outline:none}
#pv{font-size:12px;color:var(--mut);margin-top:8px}
#list,#sklist{max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:3px;margin-right:-3px}
.item{position:relative;display:flex;padding:11px 13px 11px 15px;border:1px solid var(--bd);border-radius:14px;background:var(--in);margin-bottom:8px;overflow:hidden;transition:opacity .2s;animation:in .25s ease}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--g1),var(--g2))}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.item .t{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;min-width:0}
.item .t b{color:var(--g1);font-weight:600}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:18px 8px}
#stat,#skst{font-size:12px;color:var(--mut);margin:10px 2px 0;text-align:right}
#skst{color:var(--bad)}
.rng{display:flex;align-items:center;gap:8px}
.rng span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rng input{flex:1;min-width:0;padding:10px 6px;text-align:center;font-size:15px;font-weight:700;border:1px solid var(--bd);border-radius:13px;background:var(--in);color:var(--fg);outline:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ok);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:99px;transition:.25s;z-index:5;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
#toast.bad{background:var(--bad)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#gate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
#gate:before{content:"";position:absolute;inset:-25% -15% auto -15%;height:65%;background:radial-gradient(circle at 22% 28%,rgba(99,102,241,.32),transparent 58%),radial-gradient(circle at 82% 12%,rgba(168,85,247,.26),transparent 55%);pointer-events:none}
.gbox{position:relative;width:100%;max-width:380px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:30px 22px 24px;box-shadow:var(--sh);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.gbox .logo{margin:0 auto 16px;width:54px;height:54px;border-radius:17px}
.gbox h2{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
.gbox p{margin:0 0 20px;color:var(--mut);font-size:14px}
#key{width:100%;padding:15px;font-size:16px;text-align:center;border:1px solid var(--bd);border-radius:15px;background:var(--in);color:var(--fg);outline:none;letter-spacing:.06em;font-weight:600}
#key:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.2)}
#gerr{min-height:22px;color:var(--bad);font-size:13px;font-weight:600;margin:11px 0 3px}
.gbtn{width:100%;margin-top:10px}
.sec{border:1px solid var(--bd);background:var(--in);color:var(--fg);box-shadow:none}
.gnote{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.6}
.shake .gbox{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="gate"><div class="gbox">
  <div class="logo"><svg class="ic" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg></div>
  <h2>Access Key</h2><p>Enter your private key to continue.</p>
  <input id="key" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="LC-XXXX-XXXX-XXXX">
  <div id="gerr"></div>
  <button class="pri gbtn" id="gl">Unlock &amp; remember this device</button>
  <button class="sec gbtn" id="go" style="border-radius:15px;padding:14px;font-size:15px;font-weight:700">Unlock for this session</button>
  <div class="gnote">Remembered keys keep you signed in on this device.<br>Session keys sign out when the tab is closed.</div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg></div>
      <div><h1>Link Cutter</h1><p>Clean verification links in one tap</p></div>
    </div>
    <button class="ghost" id="lock"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Lock</button>
  </header>

  <section class="card">
    <div class="lbl"><span>Input</span>
      <span class="lbl-r"><button class="ghost sm" id="clear">Clear</button><button class="ghost sm" id="paste"><svg class="ic" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Paste</button></span>
    </div>
    <textarea id="in" placeholder="Paste your links here. A serial number or email before each link is kept." spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="hint"></div>
  </section>

  <section class="card">
    <div class="lbl"><span>Result</span><span class="chip" id="cnt">0</span></div>
    <div class="seg" id="seg"><button data-m="0">Serial · Email · Link</button><button data-m="1">Serial · Link</button><button data-m="2">Link only</button></div>
    <div class="pfx">
      <div class="pl"><span>Serial prefix</span><input id="pfx" maxlength="12" placeholder="Empty = 1, 2, 3" autocomplete="off" spellcheck="false"></div>
      <div id="pv"></div>
    </div>
    <div id="list"><div class="empty">Results will appear here</div></div>
    <div id="stat"></div>
    <button class="pri wide" id="copy">Copy all links</button>
  </section>

  <section class="card" id="skcard" style="display:none">
    <div class="lbl"><span>SK tokens</span><span class="chip" id="skc">0</span></div>
    <div id="sklist"></div>
    <div id="skst"></div>
    <button class="pri wide" id="skcopy">Copy SK</button>
  </section>

  <section class="card">
    <div class="lbl"><span>Range</span></div>
    <div class="rng"><span>From</span><input id="from" type="number" inputmode="numeric" min="1" placeholder="1"><span>To</span><input id="to" type="number" inputmode="numeric" min="1" placeholder="All"><button class="pri rbtn" id="rcopy">Copy</button></div>
  </section>
</div>
<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var inp=$('in'),list=$('list'),cnt=$('cnt'),toast=$('toast'),items=[],mode=0,tt;
try{mode=+localStorage.getItem('lc_mode')||0}catch(e){}

function cutOne(chunk){
  var t=chunk.replace(/\s+/g,'');
  var m=t.match(/https?:\/\//i);
  if(!m) return '';
  t=t.slice(m.index);
  var i=t.search(/[&?]ses/i);
  if(i<0){var a=t.indexOf('&');if(a>0)i=a;}
  if(i>0)t=t.slice(0,i);
  var id=t.match(/^(https?:\/\/[^?]*\?inquiry-id=inq_[A-Za-z0-9]{30})/);
  if(id)t=id[1];
  return t.replace(/-+$/,'');
}
function joinLines(raw){
  var L=raw.split(/\r?\n/),out='';
  L.forEach(function(ln){
    ln=ln.replace(/[ \t]+/g,'');if(!ln)return;
    var k=out.lastIndexOf('https://');
    var open=k>=0&&!/inquiry-id=inq_[A-Za-z0-9]{30}/.test(out.slice(k))&&!/----|&/.test(out.slice(k));
    out+=(open?'':'\n')+ln;
  });
  return out;
}
function tokens(s){
  var re=/(https?:\/\/(?:(?!-{4})[^&\s])*?inquiry-id=inq_[A-Za-z0-9]{30}|https?:\/\/(?:(?!-{4})[^&\s])*)|(sk-ant-(?:(?!-{4})[A-Za-z0-9_\-])+)|((?:^|[^A-Za-z0-9_])(\d{1,6})(?=[.)]|-{4}))|([A-Za-z0-9](?:[A-Za-z0-9._%+]|-(?!-))*@[A-Za-z0-9.]+\.[A-Za-z]{2,})/g;
  var m,o=[];
  while((m=re.exec(s))!==null){
    if(m[1])o.push({t:'L',v:m[1],s:m.index,e:m.index+m[1].length});
    else if(m[2])o.push({t:'K',v:m[2],s:m.index,e:m.index+m[2].length});
    else if(m[4]){var st=m.index+m[0].length-m[4].length;o.push({t:'N',v:m[4],s:st,e:st+m[4].length})}
    else if(m[5])o.push({t:'M',v:m[5],s:m.index,e:m.index+m[5].length});
  }
  return o;
}
function gap(a,b){return a.e<=b.s?b.s-a.e:(b.e<=a.s?a.s-b.e:0)}
function near(list,to){var best=null,bd=1e9;list.forEach(function(x){var d=gap(x,to);if(d<bd){bd=d;best=x}});return best}
function cut(raw){
  var segs=joinLines(raw).split('\n');
  var recs=[],seen={},dup=0,pS='',pE='',pK=null;
  segs.forEach(function(seg){
    if(!seg)return;
    var tk=tokens(seg);
    var L=tk.filter(function(x){return x.t==='L'}),K=tk.filter(function(x){return x.t==='K'}),
        N=tk.filter(function(x){return x.t==='N'}),M=tk.filter(function(x){return x.t==='M'});
    if(!L.length){
      N.forEach(function(x){pS=x.v+'.'});
      M.forEach(function(x){pE=x.v});
      K.forEach(function(x){pK=x.v});
      return;
    }
    var skOf=L.map(function(){return null});
    K.forEach(function(k){
      var best=-1,bd=1e9;
      L.forEach(function(l,i){var d=gap(k,l);if(d<bd){bd=d;best=i}});
      if(best>=0&&!skOf[best])skOf[best]=k.v;
    });
    L.forEach(function(l,i){
      var n=N.length?near(N,l):null, m=M.length?near(M,l):null;
      var ser=n?n.v+'.':(pS||'');
      var email=m?m.v:(pE||'');
      var sk=skOf[i]||pK||null;
      pS='';pE='';pK=null;
      if(seen[l.v]){dup++;return}
      seen[l.v]=1;
      recs.push({ser:ser,email:email,link:l.v,sk:sk});
    });
  });
  var o=recs.map(function(r){return {ser:r.ser,pre:r.email?r.email+'----':'',link:cutOne(r.link),sk:r.sk}});
  o.forEach(function(x,k){if(!x.ser)x.ser=(k+1)+'.'});
  o.dup=dup;return o;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(m,bad){clearTimeout(tt);toast.textContent=m;toast.className=(bad?'bad ':'')+'on';tt=setTimeout(function(){toast.className=''},2000)}
function headOf(it){var s=it.disp||'';return (mode<2&&s?s+' ':'')+(mode===0&&it.pre?it.pre+(/[-\s]$/.test(it.pre)?'':' '):'')}
function fmt(it){return headOf(it)+it.link}
function pfxVal(){return ($('pfx').value||'').trim().slice(0,12)}
function rng(){var n=items.length,f=parseInt($('from').value)||1,t=parseInt($('to').value)||n;if(f<1)f=1;if(t>n)t=n;return [f,t]}

function upd(){
  var n=items.length,r=rng(),f=r[0],t=r[1];
  $('copy').textContent=n?('Copy all links ('+n+')'):'Copy all links';
  $('rcopy').textContent=!n?'Copy':(t<f?'Invalid':'Copy '+f+'\u2013'+t);
  [].forEach.call(list.querySelectorAll('.item'),function(el,i){el.style.opacity=(i+1>=f&&i+1<=t)?1:.35});
}
function drawList(){
  var p=pfxVal();
  items.forEach(function(it,i){it.disp=p?(p+(i+1)):(it.ser||'')});
  $('pv').textContent=p?('Preview: '+p+'1, '+p+'2, '+p+'3'):'Empty: 1., 2., 3.';
  if(!items.length){
    list.innerHTML='<div class="empty">'+(inp.value.trim()?'No valid links found':'Results will appear here')+'</div>';
    $('skcard').style.display='none';
    upd();return;
  }
  list.innerHTML=items.map(function(it){return '<div class="item"><div class="t"><b>'+esc(headOf(it))+'</b>'+esc(it.link)+'</div></div>'}).join('');
  var have=items.filter(function(it){return it.sk}).length;
  if(have){
    $('skcard').style.display='block';
    $('skc').textContent=have;
    $('sklist').innerHTML=items.map(function(it){return '<div class="item"><div class="t"><b>'+esc(it.disp)+'</b>'+(it.sk?esc(it.sk):'<span style="color:var(--bad)">SK not found</span>')+'</div></div>'}).join('');
    var miss=items.length-have;
    $('skst').textContent=miss?(miss+' link(s) without SK. Copy skips them.'):'';
  }else{
    $('skcard').style.display='none';
  }
  upd();
}
function run(){
  items=cut(inp.value);
  drawList();
  cnt.textContent=items.length;
  var s=[];
  if(items.length)s.push(inp.value.length.toLocaleString()+' \u2192 '+items.map(fmt).join('\n').length.toLocaleString()+' characters');
  if(items.dup)s.push(items.dup+' duplicate'+(items.dup>1?'s':'')+' removed');
  $('stat').textContent=s.join(' \u00b7 ');
}

function flash(b){if(!b)return;var o=b.textContent;b.classList.add('ok');b.textContent='Copied \u2713';setTimeout(function(){b.classList.remove('ok');b.textContent=o;upd()},1200)}
function copyText(t,btn){
  if(!t){show('Nothing to copy',1);return}
  function ok(){show('Copied to clipboard');flash(btn)}
  function fb(){
    var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(a);a.select();a.setSelectionRange(0,a.value.length);
    var s=false;try{s=document.execCommand('copy')}catch(e){}
    a.remove();if(s)ok();else show('Copy failed. Please try again.',1);
  }
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}

function segUpd(){[].forEach.call($('seg').children,function(b){b.classList.toggle('on',+b.dataset.m===mode)})}
inp.addEventListener('input',run);
$('pfx').value=(function(){try{return localStorage.getItem('lc_pfx')||''}catch(e){return ''}})();
$('pfx').addEventListener('input',function(){try{localStorage.setItem('lc_pfx',this.value)}catch(e){}drawList()});
$('from').addEventListener('input',upd);
$('to').addEventListener('input',upd);
['from','to','key'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')e.target.blur()})});
$('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;try{localStorage.setItem('lc_mode',mode)}catch(x){}segUpd();drawList()});
segUpd();

$('copy').onclick=function(){if(!items.length){show('Nothing to copy',1);return}copyText(items.map(fmt).join('\n'),this)};
$('rcopy').onclick=function(){
  if(!items.length){show('Nothing to copy',1);return}
  var r=rng();if(r[1]<r[0]){show('Invalid range',1);return}
  copyText(items.slice(r[0]-1,r[1]).map(fmt).join('\n'),this);
};
$('skcopy').onclick=function(){copyText(items.filter(function(it){return it.sk}).map(function(it){return it.disp+' '+it.sk}).join('\n'),this)};
$('clear').onclick=function(){inp.value='';$('from').value='';$('to').value='';$('hint').textContent='';run();inp.blur()};
$('paste').onclick=function(){
  function manual(){inp.focus();$('hint').textContent='Automatic paste is blocked here. Tap and hold the box, then choose Paste.';setTimeout(function(){$('hint').textContent=''},8000)}
  try{navigator.clipboard.readText().then(function(t){if(t){inp.value=t;run();inp.blur()}else manual()},manual)}catch(e){manual()}
};
inp.addEventListener('paste',function(){setTimeout(function(){run();inp.blur()},60)});
document.addEventListener('click',function(e){
  var a=document.activeElement;
  if(a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)&&!e.target.closest('textarea,input,#paste'))a.blur();
});

/* access control */
function M(m){m=m||'';
  if(/onno device/i.test(m))return 'This key is already linked to another device.';
  if(/bondho/i.test(m))return 'This key has been disabled.';
  if(/thik nai/i.test(m))return 'Invalid key. Please check and try again.';
  if(/likhun/i.test(m))return 'Please enter your key.';
  return m||'Something went wrong. Please try again.'}
function dev(){var d=null;try{d=localStorage.getItem('lc_dev');if(!d){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('d'+Date.now()+Math.random().toString(36).slice(2));localStorage.setItem('lc_dev',d)}}catch(e){}return d||('t'+Math.random().toString(36).slice(2,12))}
async function check(k){
  try{var r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:k,device:dev()})});
    var j=await r.json();return j&&typeof j.ok==='boolean'?j:{ok:false,net:1,msg:'Connection problem. Please try again.'}}
  catch(e){return {ok:false,net:1,msg:'Connection problem. Please try again.'}}
}
function openApp(){$('gate').style.display='none';$('app').style.display='block'}
function clr(){try{localStorage.removeItem('lc_auth');sessionStorage.removeItem('lc_auth')}catch(e){}}
function lockApp(){clr();$('app').style.display='none';$('gate').style.display='flex';$('key').value='';$('gerr').textContent=''}
var fails=0,until=0;
function gerr(m){$('gerr').style.color='';$('gerr').textContent=m;var g=$('gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
function busy(b){$('gl').disabled=b;$('go').disabled=b;if(b){$('gerr').style.color='var(--mut)';$('gerr').textContent='Verifying\u2026'}else{$('gerr').style.color='';$('gerr').textContent=''}}
async function tryKey(life){
  var now=Date.now();if(now<until){gerr('Too many attempts. Try again in '+Math.ceil((until-now)/1000)+'s.');return}
  var k=$('key').value.trim().toUpperCase();if(!k){gerr('Please enter your key.');return}
  busy(true);var j=await check(k);busy(false);
  if(!j.ok){if(!j.net){fails++;if(fails>=5){until=Date.now()+30000;fails=0}}gerr(M(j.msg));return}
  try{(life?localStorage:sessionStorage).setItem('lc_auth',k)}catch(e){}
  fails=0;$('key').value='';$('key').blur();openApp();
}
$('gl').onclick=function(){tryKey(true)};
$('go').onclick=function(){tryKey(false)};
$('lock').onclick=lockApp;
(async function(){
  var k=null;try{k=localStorage.getItem('lc_auth')||sessionStorage.getItem('lc_auth')}catch(e){}
  $('gate').style.display='flex';
  if(!k)return;
  busy(true);var j=await check(k);busy(false);
  if(j.ok)openApp();else{if(!j.net)clr();gerr(M(j.msg))}
})();
</script>
