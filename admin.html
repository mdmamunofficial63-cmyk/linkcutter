<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{--bg:#0b0b12;--fg:#f2f3f8;--mut:#8b90a3;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--g1:#6366f1;--g2:#a855f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,sans-serif;padding:20px 16px 40px;max-width:620px;margin:0 auto}
h1{font-size:20px}.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--fg);font-size:16px;margin-bottom:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.s{background:rgba(255,255,255,.08);border:1px solid var(--bd);padding:7px 10px;font-size:13px}
.r{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.r:first-child{border:0}
.n{flex:1;min-width:0}.n small{display:block;color:var(--mut)}
.t{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:700}.free{background:#1f6f4a}.used{background:#8a5a12}.blocked{background:#8a1f1f}
#m{color:#f87171;font-size:13px;min-height:18px}#new{display:none;word-break:break-all;font:700 16px ui-monospace,Menlo,monospace;border-color:var(--g1)}
</style></head><body>
<h1>🔑 Key Admin</h1>
<div class="c"><input id="sec" type="password" placeholder="Admin secret" autocomplete="off"><button id="ld">Load keys</button><div id="m"></div></div>
<div class="c"><input id="lb" placeholder="Notun key-er naam (optional)"><button id="cr">+ Notun key banao</button></div>
<div class="c" id="new"></div>
<div class="c" id="ls">Keys ekhane dekhabe</div>
<script>
var $=function(i){return document.getElementById(i)};
async function api(o){o.action='admin';o.admin=$('sec').value;
  try{var r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});return await r.json()}catch(e){return {ok:false,msg:'Network error'}}}
function ago(t){if(!t)return '';var d=new Date(t);return d.toLocaleString()}
function draw(j){
  $('m').textContent=j.ok?'':(j.msg||'Error');if(!j.ok)return;
  if(j.made){var n=$('new');n.style.display='block';n.textContent=j.made.id+'  '+j.made.key+'  (ekhon-i copy koro, abar dekhano hobe na)'}
  $('ls').innerHTML=j.list.map(function(x){return '<div class="r"><div class="n"><b>'+x.id+'</b> '+(x.label||'')+'<small>'+ago(x.at)+'</small></div><span class="t '+x.state+'">'+x.state+'</span><button class="s" data-o="reset" data-i="'+x.id+'">Reset</button><button class="s" data-o="block" data-i="'+x.id+'">Block</button></div>'}).join('')}
$('ld').onclick=async function(){draw(await api({op:'list'}))};
$('cr').onclick=async function(){draw(await api({op:'create',label:$('lb').value}));$('lb').value=''};
$('ls').onclick=async function(e){var b=e.target.closest('button');if(!b)return;
  if(!confirm(b.dataset.o+' '+b.dataset.i+'?'))return;draw(await api({op:b.dataset.o,id:b.dataset.i}))};
</script></body></html>
