<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a12"><title>Key Manager</title>
<style>
:root{--bg:#0a0a12;--fg:#f3f4f9;--mut:#8d92a6;--card:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.05);--g1:#6366f1;--g2:#a855f7}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 60px;max-width:640px;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-25% -15% auto -15%;height:60%;background:radial-gradient(circle at 25% 30%,rgba(99,102,241,.35),transparent 58%),radial-gradient(circle at 80% 15%,rgba(168,85,247,.28),transparent 55%);pointer-events:none;z-index:-1}
h1{font-size:23px;letter-spacing:-.03em;margin:4px 0}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 18px 40px -22px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--fg);font-size:16px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(99,102,241,.22)}
button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px -8px rgba(99,102,241,.55);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
.rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:0 0 12px}.rm input{width:auto;margin:0}.w{width:100%}.row2{display:flex;gap:8px}.row2 input{margin:0}.row2 .q{flex:0 0 78px;text-align:center}.row2 button{flex:1}
.s{background:var(--in);border:1px solid var(--bd);box-shadow:none;padding:8px 11px;font-size:12.5px;color:var(--fg)}
.s.d{color:#f87171}
.f{background:var(--in);border:1px solid var(--bd);box-shadow:none;padding:7px 12px;font-size:12.5px;color:var(--mut);white-space:nowrap}.f.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
#chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.k{border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--in)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top b{font-size:16px}.top small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.45}
.t{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:700;white-space:nowrap}.free{background:rgba(16,185,129,.2);color:#34d399}.used{background:rgba(245,158,11,.2);color:#fbbf24}.blocked{background:rgba(239,68,68,.2);color:#f87171}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.25);font:600 13.5px ui-monospace,Menlo,monospace;letter-spacing:.03em}
.kv.no{color:var(--mut);font-family:inherit;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#m{color:#f87171;font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
.mt{color:var(--mut);font-size:14px;text-align:center;padding:12px}
#new{display:none;border-color:var(--g1)}.nk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;font:700 15px ui-monospace,Menlo,monospace}.nk span{word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:#10b981;color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;transition:.25s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<h1>Key Manager</h1><div class="sub">Create, name, copy and control access keys.</div>
<div class="c"><div class="l">Authentication</div><input id="sec" type="password" placeholder="Admin secret" autocomplete="current-password"><label class="rm"><input type="checkbox" id="rm"> Remember on this device</label><button class="w" id="ld">Load keys</button><div id="m"></div></div>
<div class="c"><div class="l">Generate keys</div><input id="lb" placeholder="Name (e.g. Rahim)"><div class="row2"><input class="q" id="ct" type="number" inputmode="numeric" min="1" max="20" value="1"><button id="cr">Generate</button></div></div>
<div class="c" id="new"></div>
<div class="c"><div class="l"><span>Keys</span><button class="s" id="ca">Copy all</button></div>
<input id="sr" placeholder="Search by name or ID"><div id="chips"></div><div id="ls"><div class="mt">Load keys to see them here.</div></div></div>
<div id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)},DATA=[],VIS=[],F='all',Q='',tt;
var SN={free:'Available',used:'In use',blocked:'Blocked'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
function cp(t){if(!t){toast('Nothing to copy');return}
  function fb(){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed')}a.remove()}
  try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},fb)}catch(e){fb()}}
async function api(o){o.action='admin';o.admin=$('sec').value;
  try{var r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)});return await r.json()}catch(e){return {ok:false,msg:'Connection problem.'}}}
function mask(k){return k?k.replace(/^(LC-[A-Z0-9]{4})-[A-Z0-9]{4}-[A-Z0-9]{4}$/,'$1-\u2022\u2022\u2022\u2022-\u2022\u2022\u2022\u2022'):''}
function dt(t){return t?new Date(t).toLocaleString():''}
function row(x){
  var info=[x.id];if(x.at)info.push('Linked '+dt(x.at));if(x.last)info.push('Last active '+dt(x.last));
  return '<div class="k"><div class="top"><div><b>'+(esc(x.label)||'Unnamed')+'</b><small>'+info.join(' \u00b7 ')+'</small></div><span class="t '+x.state+'">'+SN[x.state]+'</span></div>'+
  (x.key?'<div class="kv"><span>'+mask(x.key)+'</span><button class="s" data-o="copy" data-i="'+x.id+'">Copy</button></div>':'<div class="kv no">Key not stored. Regenerate to copy it.</div>')+
  '<div class="acts"><button class="s" data-o="rename" data-i="'+x.id+'">Rename</button><button class="s" data-o="reset" data-i="'+x.id+'">Reset device</button><button class="s" data-o="block" data-i="'+x.id+'">Block</button><button class="s" data-o="regen" data-i="'+x.id+'">Regenerate</button><button class="s d" data-o="delete" data-i="'+x.id+'">Delete</button></div></div>'}
function render(){
  var c={all:DATA.length,free:0,used:0,blocked:0};DATA.forEach(function(x){c[x.state]++});
  $('chips').innerHTML=['all','free','used','blocked'].map(function(s){return '<button class="f'+(F===s?' on':'')+'" data-f="'+s+'">'+(s==='all'?'All':SN[s])+' '+c[s]+'</button>'}).join('');
  var q=Q.toLowerCase();
  VIS=DATA.filter(function(x){return (F==='all'||x.state===F)&&(!q||((x.label||'')+' '+x.id).toLowerCase().indexOf(q)>=0)});
  $('ls').innerHTML=VIS.length?VIS.map(row).join(''):'<div class="mt">'+(DATA.length?'No keys match.':'Load keys to see them here.')+'</div>';
}
function draw(j){
  $('m').textContent=j.ok?'':(/thik nai/i.test(j.msg||'')?'Incorrect admin secret.':(j.msg||'Something went wrong.'));
  if(!j.ok)return;
  try{localStorage.removeItem('lc_adm');sessionStorage.removeItem('lc_adm');(($('rm').checked)?localStorage:sessionStorage).setItem('lc_adm',$('sec').value)}catch(e){}
  DATA=j.list;render();
  if(j.made&&j.made.length){var n=$('new');n.style.display='block';
    n.innerHTML='<div class="l">New keys</div>'+j.made.map(function(m){return '<div class="nk"><span>'+m.key+'</span><button class="s" data-c="'+m.key+'">Copy</button></div>'}).join('')}
}
$('ld').onclick=async function(){draw(await api({op:'list'}))};
$('cr').onclick=async function(){var j=await api({op:'create',label:$('lb').value,count:$('ct').value});draw(j);if(j.ok){$('lb').value='';toast('Generated')}};
$('sr').oninput=function(){Q=this.value;render()};
$('chips').onclick=function(e){var b=e.target.closest('button');if(b){F=b.dataset.f;render()}};
$('new').onclick=function(e){var b=e.target.closest('button');if(b)cp(b.dataset.c)};
$('ca').onclick=function(){var t=VIS.filter(function(x){return x.key}).map(function(x){return (x.label||x.id)+' \u2014 '+x.key}).join('\n');cp(t)};
$('ls').onclick=async function(e){
  var b=e.target.closest('button');if(!b)return;
  var id=b.dataset.i,o=b.dataset.o,x=DATA.filter(function(y){return y.id===id})[0];if(!x)return;
  if(o==='copy'){cp(x.key);return}
  if(o==='rename'){var n=prompt('Name for '+id,x.label||'');if(n===null)return;draw(await api({op:'rename',id:id,label:n}));return}
  var msg={reset:'Unlink the device from '+id+'? The key becomes available again.',block:'Block '+id+'? It will stop working immediately.',regen:'Generate a new key for '+id+'? The old key stops working.',delete:'Delete '+id+' permanently?'}[o];
  if(!confirm(msg))return;
  var j=await api({op:o,id:id});draw(j);
  if(j.ok&&o==='regen'){var y=DATA.filter(function(z){return z.id===id})[0];if(y&&y.key){var n2=$('new');n2.style.display='block';n2.innerHTML='<div class="l">New key</div><div class="nk"><span>'+y.key+'</span><button class="s" data-c="'+y.key+'">Copy</button></div>'}}
};
try{var ls=localStorage.getItem('lc_adm'),sv=ls||sessionStorage.getItem('lc_adm');if(sv){$('sec').value=sv;$('rm').checked=!!ls;$('ld').click()}}catch(e){}
</script></body></html>
